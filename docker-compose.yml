# Starter hele løsningen lokalt: API (FastAPI) + database (MySQL).
# Start:  docker compose up --build
# Hemmeligheder (adgangskoder) hentes fra filen .env, som ikke versionsstyres.

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      # Til MySQL Workbench: kun tilgængelig lokalt (127.0.0.1), ikke fra netværket
      - "127.0.0.1:3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      REPOSITORY: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      API_KEY: ${API_KEY}
      AUDIT_LOG_FILE: /app/logs/audit.log
    volumes:
      # Audit-loggen gemmes i mappen logs/ på værten (versionsstyres ikke)
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  db_data:
